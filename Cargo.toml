[package]
name = "opossum"
readme = "README.md"
edition = "2024"

[dependencies] # of the opossum meta pacakge
opossum_core = { workspace = true }
opm_macros_lib = { workspace = true }
opossum_backend = { workspace = true }
opossum_cli = { workspace = true }
opossum_gui = { workspace = true }

[workspace]
members = [
    "opossum_core",
    "opossum_cli",
    "opossum_backend",
    "opossum_gui",
    "opossum_core/opm_macros_lib",
    "xtask",
]
# default-members = ["opossum_backend", "opossum_cli", "opossum_gui", "opossum_core", "opossum_core/opm_macros_lib"]
# default-members = ["opossum_backend", "opossum_cli", "opossum_gui", "opossum_core"]
resolver = "3"

[workspace.package]
version = "0.7.2"
edition = "2024"
authors = [
    "Udo Eisenbarth <u.eisenbarth@gsi.de>",
    "Yannik Zobus <y.zobus@gsi.de>",
]
description = "Open-source Optics Simulation Software and Unified Modeler"
repository = "https://github.com/opossum-labs/opossum"
license = "GPL-3.0"
keywords = ["laser", "optics", "physics", "simulation"]
categories = ["science", "simulation"]

[workspace.dependencies]
opossum_core = { version = "0.7.2", path = "opossum_core" }
opm_macros_lib = { version = "0.7.2", path = "opossum_core/opm_macros_lib" }
opossum_backend = { version = "0.7.2", path = "opossum_backend" }
opossum_cli = { version = "0.7.2", path = "opossum_cli" }
opossum_gui = { version = "0.7.2", path = "opossum_gui" }

approx = "0.5"
chrono = { version = "0.4.45", features = ["serde"] }
itertools = "0.15.0"
log = "0.4"
nalgebra = { version = "0.35.0", features = ["serde-serialize", "rayon"] }
num = "0.4"
ron = "0.12"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
tempfile = "3.27"
uom = { version = "0.38", features = ["serde"] }
utoipa = { version = "5.4", features = ["actix_extras", "uuid"] }
uuid = { version = "1.23", features = ["v4", "fast-rng", "serde", "js"] }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

[profile.release]
# Optimize for size. "z" is even smaller than "s".
# opt-level = "z"
# Link-Time Optimization increases compile time but reduces binary size.
lto = true
# Reduces parallelism in the compiler, allowing for better optimization.
codegen-units = 1
# Abort on panic rather than unwinding the stack.
panic = "abort"
# Automatically strip symbols from the binary.
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
opt-level = 3
lto = "thin"
codegen-units = 1

# Disable debug symbols an link time optimization due to limitations of the Linux pipeline VM.
[profile.test]
debug = true
opt-level = 0
lto = "off"
codegen-units = 1
strip = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release.package.opossum_gui]
strip = false

[profile.dist.package.opossum_gui]
strip = false
