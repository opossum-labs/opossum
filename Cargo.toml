[workspace]
members = [
    "opossum_core",
    "opossum_cli",
    "opossum_backend",
    "opossum_gui",
    "opossum_core/opm_macros_lib",
    "xtask", 
]
default-members = ["opossum_backend", "opossum_cli", "opossum_gui", "opossum_core", "opossum_core/opm_macros_lib"]
resolver = "3"

[workspace.package]
version = "0.7.0-beta.2"
edition = "2024"
authors = [
    "Udo Eisenbarth <u.eisenbarth@gsi.de>",
    "Yannik Zobus <y.zobus@gsi.de>",
]
description = "Open-source Optics Simulation Software and Unified Modeler"
repository = "https://github.com/opossum-labs/opossum"
license = "GPL-3.0"
keywords = ["laser", "optics", "physics", "simulation"]
categories = ["science", "simulation"]

[workspace.dependencies]
opossum_core = { version = "0.7.0-beta.1", path = "opossum_core" }
opm_macros_lib = { version = "0.7.0-beta.1", path = "opossum_core/opm_macros_lib" }
opossum_backend = { version = "0.7.0-beta.1", path = "opossum_backend" }

approx = "0.5"
chrono = { version = "0.4", features = ["serde"] }
itertools = "0.14"
log = "0.4"
nalgebra = { version = "0.34.0", features = ["serde-serialize", "rayon"] }
num = "0.4"
ron = "0.11.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
strum = { version = "0.27.1", features = ["derive"] }
strum_macros = "0.27.1"
tempfile = "3.23"
tokio = { version = "1", features = ["process"] }
uom = { version = "0.37", features = ["serde"] }
utoipa = { version = "5.4", features = ["actix_extras", "uuid"] }
uuid = { version = "1", features = ["v4", "fast-rng", "serde", "js"] }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

[profile.release]
# Optimize for size. "z" is even smaller than "s".
# opt-level = "z"
# Link-Time Optimization increases compile time but reduces binary size.
lto = true
# Reduces parallelism in the compiler, allowing for better optimization.
codegen-units = 1
# Abort on panic rather than unwinding the stack.
panic = "abort"
# Automatically strip symbols from the binary.
strip = true

# Disable debug symbols an link time optimization due to limitations of the Linux pipeline VM.
[profile.test]
debug = 0
lto = "off"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
