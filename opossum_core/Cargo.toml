[package]
name = "opossum_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
build = "build.rs"
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "6A79F3B1-0417-472C-8C99-F1ADB17DE27D"
path-guid = "56710F06-5772-4D76-BA9F-83122E49A2C3"
license = false
eula = false
timestamp = "Versign"
product-icon = "opossum/logo/Logo_square.ico"
banner = "opossum/logo/Logo_InstallBanner.png"
dialog = "opossum/logo/Logo_InstallDialog.png"

[dependencies]
opm_macros_lib = { path = "opm_macros_lib" }

approx.workspace = true
chrono.workspace = true
itertools.workspace = true
log.workspace = true
nalgebra.workspace = true
num.workspace = true
ron.workspace = true
serde.workspace = true
strum.workspace = true
strum_macros.workspace = true
tempfile.workspace = true
uom.workspace = true
utoipa.workspace = true
uuid.workspace = true

petgraph = { version = "0.8.2", features = ["serde-1"] } # the graph library
csv = "1"
plotters = "0.3"
libm = { version = "0.2" }
embed-doc-image = "0.1"                                  # allows for embedded images in the rust API doc
image = "0.25"
rand = "0.9"
sobol = "1"
colorous = "1"
delaunator = "1"
kahan = "0.1"
roots = "0.0.8"
voronator = "0.2"
rayon = "1.10"
tinytemplate = "1"
spade = "2.12"
earcutr = "0.5"
num-traits = "0.2"
mutants = "0.0.3"

[lints.rust]
# missing_docs = "warn"

[features]
doc-images = []

[dev-dependencies]
regex = "1"
assert_matches = "1"
testing_logger = "0.1"
criterion = { version = "0.7.0", features = ["html_reports"] }

[build-dependencies]
vergen-git2 = { version = "1" } # get git version infos compiled in binary

[[example]]
name = "hhts"
path = "examples/hhts/hhts.rs"

[[example]]
name = "grating_examples"
path = "examples/grating_examples/grating_examples.rs"

[[bench]]
name = "fluence_estimator"
harness = false
