[package]
name = "opossum_gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[dependencies]
# Workspace dependencies
opossum_core = { workspace = true }
opm_macros_lib = { workspace = true }
opossum_registry = { workspace = true }

# Common workspace dependencies
approx.workspace = true
chrono.workspace = true
itertools.workspace = true
log.workspace = true
nalgebra.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
uom.workspace = true
uuid.workspace = true

# UI and Dioxus ecosystem
dioxus = { version = "0.7" }
dioxus-free-icons = { version = "0.10", features = ["font-awesome-solid"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

# Utility libraries shared across platforms
futures-util = "0.3"
heck = "0.5"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rust-sugiyama = "0.4"
webbrowser = "1.2.3"
web-time = "1.1" # Cross-platform Instant and SystemTime replacement
rfd = { version = "0.17" }

# Desktop-specific dependencies (optional, enabled via "desktop" feature)
directories = { version = "6", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tempfile = { workspace = true, optional = true }

# Web-specific dependencies (optional, enabled via "web" feature)
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
web-sys = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["process", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false }

# [target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# plotly = { version = "0.13.5", features = ["kaleido"] }
# [target.'cfg(target_arch = "wasm32")'.dependencies]
# plotly = { version = "0.13.5" }

[features]
default = ["desktop"]

# Activates Dioxus desktop renderer and native system features
desktop = [
    "dioxus/desktop",
    "dep:directories",
    "dep:image",
    "dep:tempfile",
]

# Activates Dioxus web renderer and browser/wasm bindings
web = [
    "dioxus/web",
    "dep:gloo-timers",
    "dep:web-sys",
]

# Mobile platform support
mobile = ["dioxus/mobile"]
