<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="796" viewBox="0 0 1120 796"
     font-family="Helvetica, Arial, sans-serif">
  <title>What a component's geometry depends on</title>
  <desc>Three bands from top to bottom. Defined by the user, edited in the GUI and stored in the .opm
        file: the node properties (the node type as a preset, the shape: curvatures, thickness, optic
        shape, and one surface property per face with its coating and LIDT), the placement (an absolute
        or automatic position and the alignment) and the connections with their distances. Derived and
        never written to the file: create_geometry() turns the shape into the Geometry in the node's
        own frame, with numbered faces, where each face ends and the body of a solid;
        effective_node_iso() is the position followed by the alignment. move_by(node iso) moves the
        geometry to the node. Separately, opossum_scene meshes the geometry, still in the node's own
        frame, into triangles, which are placed at the node iso. install_geometry(), run by
        update_surfaces(), keeps the moved geometry as the runtime geometry, gives every face the
        coating and LIDT of its surface property and lets
        every port name its face; it is rebuilt on create, load, placement, alignment, set_coating,
        set_lidt and analysis start, not on set_property. The runtime geometry holds the faces with
        their optic surfaces and, for a solid, the body, which is the medium and holds the inversion
        built by prepare_volume(). Used by: ray trace and ghost focus at the faces, gain and absorption
        in the body, the 3D view, which draws those meshes and never reads the runtime geometry,
        and the alignment run, which traces the axis ray through the faces and, with the distance of
        the connection, sets the automatic position of the next node.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-next" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- A background of its own keeps the arrows readable on the dark book themes. -->
  <rect x="0" y="0" width="1120" height="796" rx="8" fill="#ffffff"/>

  <!-- ── band 1: defined by the user ──────────────────────────────────────── -->
  <rect x="24" y="16" width="1072" height="164" rx="8" fill="#ebf8ff" stroke="#90cdf4"/>
  <text x="40" y="38" font-size="11" fill="#4a5568"><tspan font-size="13" font-weight="bold"
        fill="#2c5282">defined by the user</tspan> · edited in the GUI, stored in the .opm file</text>

  <rect x="40" y="48" width="560" height="124" rx="6" fill="#ffffff" stroke="#3182ce"/>
  <text x="320" y="68" font-size="14" text-anchor="middle" fill="#1a202c">node properties</text>
  <text x="320" y="85" font-size="11" text-anchor="middle" fill="#4a5568">node type = the preset: lens, mirror, grating, &#8230;</text>

  <rect x="52" y="96" width="240" height="66" rx="5" fill="#ebf8ff" stroke="#63b3ed"/>
  <text x="172" y="116" font-size="13" text-anchor="middle" fill="#1a202c">surfaces</text>
  <text x="172" y="134" font-size="11" text-anchor="middle" fill="#4a5568">coating + LIDT, one per face,</text>
  <text x="172" y="150" font-size="11" text-anchor="middle" fill="#4a5568">named after it: front surface, &#8230;</text>

  <rect x="304" y="96" width="284" height="66" rx="5" fill="#ebf8ff" stroke="#63b3ed"/>
  <text x="446" y="116" font-size="13" text-anchor="middle" fill="#1a202c">shape</text>
  <text x="446" y="134" font-size="11" text-anchor="middle" fill="#4a5568">curvatures, thickness,</text>
  <text x="446" y="150" font-size="11" text-anchor="middle" fill="#4a5568">optic shape, &#8230;</text>

  <rect x="616" y="48" width="240" height="124" rx="6" fill="#ffffff" stroke="#3182ce"/>
  <text x="736" y="80" font-size="14" text-anchor="middle" fill="#1a202c">placement</text>
  <text x="736" y="110" font-size="12" text-anchor="middle" fill="#4a5568">position: absolute or automatic</text>
  <text x="736" y="130" font-size="12" text-anchor="middle" fill="#4a5568">alignment: decenter, tilt</text>

  <rect x="872" y="48" width="208" height="124" rx="6" fill="#ffffff" stroke="#3182ce"/>
  <text x="976" y="80" font-size="14" text-anchor="middle" fill="#1a202c">connections</text>
  <text x="976" y="110" font-size="12" text-anchor="middle" fill="#4a5568">distance between</text>
  <text x="976" y="130" font-size="12" text-anchor="middle" fill="#4a5568">two ports</text>

  <!-- ── band 2: derived ──────────────────────────────────────────────────── -->
  <rect x="24" y="192" width="1072" height="414" rx="8" fill="#f0fff4" stroke="#9ae6b4"/>
  <text x="40" y="214" font-size="11" fill="#4a5568"><tspan font-size="13" font-weight="bold"
        fill="#276749">derived</tspan> · never written to the file</text>

  <rect x="304" y="232" width="284" height="100" rx="6" fill="#ffffff" stroke="#38a169"/>
  <text x="446" y="254" font-size="14" text-anchor="middle" fill="#1a202c">Geometry</text>
  <text x="446" y="272" font-size="11" text-anchor="middle" fill="#718096">in the node's own frame</text>
  <text x="446" y="294" font-size="11" text-anchor="middle" fill="#4a5568">numbered faces with their optic surfaces</text>
  <text x="446" y="311" font-size="11" text-anchor="middle" fill="#4a5568">where a face ends (rim) &#183; a solid's body</text>

  <rect x="616" y="232" width="240" height="100" rx="6" fill="#ffffff" stroke="#38a169"/>
  <text x="736" y="258" font-size="14" text-anchor="middle" fill="#1a202c">effective_node_iso()</text>
  <text x="736" y="280" font-size="12" text-anchor="middle" fill="#4a5568">position &#8728; alignment</text>
  <text x="736" y="302" font-size="11" text-anchor="middle" fill="#718096">where the node sits</text>
  <text x="736" y="317" font-size="11" text-anchor="middle" fill="#718096">and how it is turned</text>

  <!-- band 1 to band 2 -->
  <line x1="446" y1="172" x2="446" y2="228" stroke="#4a5568" marker-end="url(#arrow)"/>
  <text x="454" y="204" font-size="11" fill="#4a5568">create_geometry()</text>
  <line x1="736" y1="172" x2="736" y2="228" stroke="#4a5568" marker-end="url(#arrow)"/>

  <!-- Moving the geometry is an operation, not a stage: geometry and placement meet in move_by. -->
  <line x1="446" y1="332" x2="446" y2="356" stroke="#4a5568" marker-end="url(#arrow)"/>
  <line x1="736" y1="332" x2="736" y2="356" stroke="#4a5568" marker-end="url(#arrow)"/>
  <!-- The 3D view takes the geometry in the node's own frame: its line passes under move_by,
       drawn first and cut by a halo, so the crossing reads as a bridge. -->
  <line x1="572" y1="332" x2="572" y2="436" stroke="#4a5568" marker-end="url(#arrow)"/>
  <line x1="562" y1="360" x2="582" y2="360" stroke="#f0fff4" stroke-width="8"/>
  <line x1="446" y1="360" x2="736" y2="360" stroke="#276749" stroke-width="3"/>
  <text x="660" y="352" font-size="12" text-anchor="middle" fill="#276749">move_by(node iso)</text>

  <!-- Drawing is an operation of its own: the geometry is meshed in the node's frame and the
       meshes are placed at the node iso; the geometry itself is not moved. -->
  <line x1="800" y1="332" x2="800" y2="436" stroke="#4a5568" marker-end="url(#arrow)"/>
  <line x1="572" y1="440" x2="800" y2="440" stroke="#276749" stroke-width="3"/>
  <text x="686" y="432" font-size="12" text-anchor="middle" fill="#276749">meshed by opossum_scene, at node iso</text>

  <!-- install_geometry: the moved geometry, with the surface properties, becomes the runtime geometry -->
  <line x1="520" y1="360" x2="520" y2="476" stroke="#4a5568" marker-end="url(#arrow)"/>
  <line x1="172" y1="172" x2="172" y2="476" stroke="#4a5568" marker-end="url(#arrow)"/>
  <text x="508" y="380" font-size="12" text-anchor="end" fill="#276749">install_geometry(), run by update_surfaces()</text>
  <text x="508" y="397" font-size="11" text-anchor="end" fill="#4a5568">every face: coating + LIDT of its surface property</text>
  <text x="508" y="412" font-size="11" text-anchor="end" fill="#4a5568">every port names the face it sits on (surface_ports)</text>
  <text x="508" y="432" font-size="11" text-anchor="end" fill="#b7791f">rebuilt on create, load, placement, alignment,</text>
  <text x="508" y="447" font-size="11" text-anchor="end" fill="#b7791f">set_coating, set_lidt and analysis start;</text>
  <text x="508" y="462" font-size="11" text-anchor="end" fill="#c53030">not on set_property</text>

  <rect x="52" y="480" width="548" height="114" rx="6" fill="#c6f6d5" stroke="#276749"/>
  <text x="326" y="502" font-size="14" text-anchor="middle" fill="#1a202c">runtime geometry</text>
  <text x="326" y="519" font-size="11" text-anchor="middle" fill="#276749">NodeAttr::runtime_geometry(), not serialized</text>

  <rect x="64" y="530" width="260" height="54" rx="5" fill="#ffffff" stroke="#38a169"/>
  <text x="194" y="550" font-size="12" text-anchor="middle" fill="#1a202c">faces at the node</text>
  <text x="194" y="570" font-size="11" text-anchor="middle" fill="#4a5568">optic surfaces: coating, LIDT, hit map</text>

  <rect x="336" y="530" width="252" height="54" rx="5" fill="#ffffff" stroke="#38a169"/>
  <text x="462" y="550" font-size="12" text-anchor="middle" fill="#1a202c">body of a solid = the medium</text>
  <text x="462" y="570" font-size="11" text-anchor="middle" fill="#4a5568">inversion, from prepare_volume()</text>

  <!-- ── band 3: used by ──────────────────────────────────────────────────── -->
  <rect x="24" y="618" width="1072" height="136" rx="8" fill="#fffaf0" stroke="#fbd38d"/>
  <text x="40" y="640" font-size="11" fill="#4a5568"><tspan font-size="13" font-weight="bold"
        fill="#9c4221">used by</tspan> · simulation and GUI</text>

  <rect x="52" y="652" width="272" height="90" rx="6" fill="#ffffff" stroke="#dd6b20"/>
  <text x="188" y="674" font-size="13" text-anchor="middle" fill="#1a202c">ray trace, ghost focus</text>
  <text x="188" y="694" font-size="11" text-anchor="middle" fill="#4a5568">intersect(face, ray), then the</text>
  <text x="188" y="709" font-size="11" text-anchor="middle" fill="#4a5568">surface effect acts at the hit;</text>
  <text x="188" y="724" font-size="11" text-anchor="middle" fill="#4a5568">hit maps go into the reports</text>

  <rect x="336" y="652" width="264" height="90" rx="6" fill="#ffffff" stroke="#dd6b20"/>
  <text x="468" y="674" font-size="13" text-anchor="middle" fill="#1a202c">gain and absorption</text>
  <text x="468" y="694" font-size="11" text-anchor="middle" fill="#4a5568">in the body of a volume node:</text>
  <text x="468" y="709" font-size="11" text-anchor="middle" fill="#4a5568">ray trace along each chord,</text>
  <text x="468" y="724" font-size="11" text-anchor="middle" fill="#4a5568">energy flow without rays</text>

  <rect x="616" y="652" width="240" height="90" rx="6" fill="#ffffff" stroke="#dd6b20"/>
  <text x="736" y="674" font-size="13" text-anchor="middle" fill="#1a202c">3D view (GUI)</text>
  <text x="736" y="694" font-size="11" text-anchor="middle" fill="#4a5568">draws the meshes of the geometry,</text>
  <text x="736" y="709" font-size="11" text-anchor="middle" fill="#4a5568">placed at the node iso; never</text>
  <text x="736" y="724" font-size="11" text-anchor="middle" fill="#4a5568">reads the runtime geometry</text>

  <rect x="872" y="652" width="208" height="90" rx="6" fill="#ffffff" stroke="#dd6b20"/>
  <text x="976" y="674" font-size="13" text-anchor="middle" fill="#1a202c">alignment run</text>
  <text x="976" y="694" font-size="11" text-anchor="middle" fill="#4a5568">calc_node_positions():</text>
  <text x="976" y="709" font-size="11" text-anchor="middle" fill="#4a5568">the axis ray through</text>
  <text x="976" y="724" font-size="11" text-anchor="middle" fill="#4a5568">the faces of each node</text>

  <!-- band 2 to band 3 -->
  <line x1="194" y1="594" x2="194" y2="648" stroke="#4a5568" marker-end="url(#arrow)"/>
  <line x1="462" y1="594" x2="462" y2="648" stroke="#4a5568" marker-end="url(#arrow)"/>
  <!-- The 3D view takes the placed meshes, not the runtime geometry. -->
  <line x1="720" y1="440" x2="720" y2="648" stroke="#4a5568" marker-end="url(#arrow)"/>
  <!-- Drawn over the 3D-view line with a white halo, so the crossing reads as a bridge. -->
  <line x1="710" y1="540" x2="730" y2="540" stroke="#f0fff4" stroke-width="6"/>
  <path d="M 600 540 L 920 540 L 920 648" fill="none" stroke="#4a5568" marker-end="url(#arrow)"/>

  <!-- The alignment run places the next node: the axis ray it leaves with, carried on by the
       distance of the connection, is that node's automatic position. -->
  <path d="M 1040 652 L 1040 274 L 860 274" fill="none" stroke="#2b6cb0" stroke-dasharray="5 4"
        marker-end="url(#arrow-next)"/>
  <line x1="976" y1="172" x2="976" y2="274" stroke="#4a5568"/>
  <circle cx="976" cy="274" r="3" fill="#4a5568"/>
  <text x="984" y="226" font-size="11" fill="#4a5568">distance</text>
  <text x="1032" y="404" font-size="11" text-anchor="end" fill="#2b6cb0">automatic position</text>
  <text x="1032" y="419" font-size="11" text-anchor="end" fill="#2b6cb0">of the next node</text>

  <!-- ── legend ───────────────────────────────────────────────────────────── -->
  <line x1="40" y1="778" x2="76" y2="778" stroke="#4a5568" marker-end="url(#arrow)"/>
  <text x="84" y="782" font-size="11" fill="#4a5568">feeds into</text>

  <line x1="180" y1="778" x2="216" y2="778" stroke="#276749" stroke-width="3"/>
  <text x="224" y="782" font-size="11" fill="#276749">operation on what flows in</text>

  <line x1="400" y1="778" x2="436" y2="778" stroke="#2b6cb0" stroke-dasharray="5 4"
        marker-end="url(#arrow-next)"/>
  <text x="444" y="782" font-size="11" fill="#2b6cb0">the alignment run sets the position of the next node</text>
</svg>
