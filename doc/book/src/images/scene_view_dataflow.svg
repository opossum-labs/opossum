<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470"
     font-family="Helvetica, Arial, sans-serif">
  <title>How a model reaches the 3D view</title>
  <desc>The model is meshed in the backend and travels over two HTTP endpoints to the viewer
        component. optoscene and dioxus_glb_viewer have no dependency on each other; the GUI is the
        only seam between them.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- ── the backend, top row ─────────────────────────────────────────────── -->
  <rect x="24" y="24" width="812" height="118" rx="8"
        fill="none" stroke="#a0aec0" stroke-dasharray="6 4"/>
  <text x="38" y="44" font-size="12" fill="#718096">opossum_backend</text>

  <rect x="44" y="58" width="196" height="62" rx="6" fill="#e2e8f0" stroke="#4a5568"/>
  <text x="142" y="82" font-size="14" text-anchor="middle" fill="#1a202c">opossum_core</text>
  <text x="142" y="102" font-size="12" text-anchor="middle" fill="#4a5568">OpmDocument</text>

  <rect x="318" y="58" width="224" height="62" rx="6" fill="#e2e8f0" stroke="#4a5568"/>
  <text x="430" y="82" font-size="14" text-anchor="middle" fill="#1a202c">scene_export.rs</text>
  <text x="430" y="102" font-size="12" text-anchor="middle" fill="#4a5568">the seam</text>

  <rect x="620" y="58" width="196" height="62" rx="6" fill="#e2e8f0" stroke="#4a5568"/>
  <text x="718" y="82" font-size="14" text-anchor="middle" fill="#1a202c">optoscene</text>
  <text x="718" y="102" font-size="12" text-anchor="middle" fill="#4a5568">Scene &#8594; glTF</text>

  <line x1="240" y1="89" x2="312" y2="89" stroke="#4a5568" marker-end="url(#arrow)"/>
  <line x1="542" y1="89" x2="614" y2="89" stroke="#4a5568" marker-end="url(#arrow)"/>

  <!-- ── the two endpoints ────────────────────────────────────────────────── -->
  <line x1="300" y1="142" x2="300" y2="180" stroke="#4a5568" marker-end="url(#arrow)"/>
  <line x1="660" y1="142" x2="660" y2="180" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="110" y="180" width="380" height="56" rx="6" fill="#fefcbf" stroke="#b7791f"/>
  <text x="300" y="203" font-size="13" text-anchor="middle" fill="#1a202c">GET /api/document/scene/manifest</text>
  <text x="300" y="222" font-size="11" text-anchor="middle" fill="#744210">uid, name, geometry hash, position, rotation</text>

  <rect x="500" y="180" width="380" height="56" rx="6" fill="#fefcbf" stroke="#b7791f"/>
  <text x="690" y="203" font-size="13" text-anchor="middle" fill="#1a202c">GET /api/document/scene/node/{uid}.glb</text>
  <text x="690" y="222" font-size="11" text-anchor="middle" fill="#744210">one component, in its own frame</text>

  <!-- ── the HTTP boundary ────────────────────────────────────────────────── -->
  <line x1="24" y1="262" x2="930" y2="262" stroke="#a0aec0" stroke-dasharray="4 4"/>
  <text x="930" y="257" font-size="11" text-anchor="end" fill="#718096">HTTP</text>

  <!-- ── the GUI and the viewer ───────────────────────────────────────────── -->
  <rect x="24" y="288" width="472" height="118" rx="8"
        fill="none" stroke="#a0aec0" stroke-dasharray="6 4"/>
  <text x="38" y="308" font-size="12" fill="#718096">opossum_gui</text>

  <rect x="80" y="322" width="360" height="62" rx="6" fill="#c6f6d5" stroke="#276749"/>
  <text x="260" y="346" font-size="14" text-anchor="middle" fill="#1a202c">objects_of()</text>
  <text x="260" y="366" font-size="12" text-anchor="middle" fill="#276749">the only seam between the two crates</text>

  <rect x="620" y="322" width="260" height="62" rx="6" fill="#e2e8f0" stroke="#4a5568"/>
  <text x="750" y="346" font-size="14" text-anchor="middle" fill="#1a202c">dioxus_glb_viewer</text>
  <text x="750" y="366" font-size="12" text-anchor="middle" fill="#4a5568">GlbViewer, three.js</text>

  <line x1="300" y1="236" x2="300" y2="316" stroke="#4a5568" marker-end="url(#arrow)"/>
  <line x1="440" y1="353" x2="614" y2="353" stroke="#4a5568" marker-end="url(#arrow)"/>
  <text x="527" y="345" font-size="11" text-anchor="middle" fill="#4a5568">Vec&lt;GlbObject&gt;</text>

  <path d="M 700 236 L 700 282 L 750 282 L 750 316"
        fill="none" stroke="#4a5568" marker-end="url(#arrow)"/>
  <text x="762" y="286" font-size="11" fill="#4a5568">fetched by the webview itself</text>

  <!-- ── what is deliberately absent: the link that is not there ──────────── -->
  <path d="M 822 89 L 980 89 L 980 353 L 886 353"
        fill="none" stroke="#c53030" stroke-dasharray="5 5"/>
  <line x1="970" y1="211" x2="990" y2="231" stroke="#c53030" stroke-width="2"/>
  <line x1="990" y1="211" x2="970" y2="231" stroke="#c53030" stroke-width="2"/>
  <text x="1002" y="215" font-size="11" fill="#c53030">no dependency,</text>
  <text x="1002" y="232" font-size="11" fill="#c53030">in either direction</text>
</svg>
