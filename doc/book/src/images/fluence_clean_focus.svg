<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430"
     font-family="Helvetica, Arial, sans-serif">
  <title>Light turned over as a whole behind a clean focus</title>
  <desc>A cut through the light behind an ideal lens: five rays of the upper half, numbered 1 near
        the axis to 5 at the edge, and the lower half drawn faintly. All rays meet in one focus F.
        At plane A, before the focus, every tube between two neighboring rays keeps its turn (+).
        At plane C, behind the focus, every tube arrives turned over (−), all of them alike: the
        light turned as a whole and does not fold over itself, so there is no warning.</desc>

  <!-- A background of its own keeps the figure readable on the dark book themes. -->
  <rect x="0" y="0" width="680" height="430" rx="8" fill="#ffffff"/>

  <text x="330" y="30" font-size="14" font-weight="bold" text-anchor="middle"
        fill="#1a202c">behind an ideal lens, in a cut</text>

  <!-- the axis and the lens -->
  <line x1="30" y1="210" x2="620" y2="210" stroke="#a0aec0" stroke-width="1"
        stroke-dasharray="8 4"/>
  <path d="M 80 40 Q 102 210 80 380 Q 58 210 80 40 Z" fill="#e6fffa" stroke="#319795"
        stroke-width="1.5"/>

  <!-- the lower half, faint -->
  <g stroke="#cbd5e0" stroke-width="1">
    <line x1="80" y1="240" x2="600" y2="196.67"/>
    <line x1="80" y1="270" x2="600" y2="183.33"/>
    <line x1="80" y1="300" x2="600" y2="170"/>
    <line x1="80" y1="330" x2="600" y2="156.67"/>
    <line x1="80" y1="360" x2="600" y2="143.33"/>
  </g>
  <!-- the upper half: rays 1 (near the axis) to 5 (at the edge), all through the focus -->
  <g stroke="#2b6cb0" stroke-width="1.3">
    <line x1="80" y1="180" x2="600" y2="223.33"/>
    <line x1="80" y1="150" x2="600" y2="236.67"/>
    <line x1="80" y1="120" x2="600" y2="250"/>
    <line x1="80" y1="90" x2="600" y2="263.33"/>
    <line x1="80" y1="60" x2="600" y2="276.67"/>
  </g>
  <g font-size="12" fill="#2b6cb0" text-anchor="end">
    <text x="62" y="184">1</text><text x="62" y="154">2</text><text x="62" y="124">3</text>
    <text x="62" y="94">4</text><text x="62" y="64">5</text>
  </g>
  <circle cx="440" cy="210" r="4" fill="#1a202c"/>
  <text x="440" y="198" font-size="12" font-weight="bold" text-anchor="middle"
        fill="#1a202c">F</text>

  <!-- plane A, before the focus -->
  <line x1="260" y1="124" x2="260" y2="204" stroke="#2d3748" stroke-width="2"/>
  <text x="260" y="116" font-size="13" font-weight="bold" text-anchor="middle"
        fill="#2d3748">A</text>
  <g font-size="11" fill="#2b6cb0" font-weight="bold">
    <text x="266" y="191">+</text><text x="266" y="176">+</text>
    <text x="266" y="161">+</text><text x="266" y="146">+</text>
  </g>

  <!-- plane C, behind the focus -->
  <line x1="590" y1="216" x2="590" y2="280" stroke="#2d3748" stroke-width="2"/>
  <text x="590" y="298" font-size="13" font-weight="bold" text-anchor="middle"
        fill="#2d3748">C</text>
  <g font-size="12" fill="#e53e3e" font-weight="bold">
    <text x="606" y="233">−</text><text x="606" y="245">−</text>
    <text x="606" y="258">−</text><text x="606" y="270">−</text>
  </g>

  <g font-size="12" fill="#2d3748">
    <text x="40" y="400">A: every tube keeps its turn (+). C: every tube arrives turned over (−), all alike:</text>
    <text x="40" y="416">the light turned as a whole, as behind a mirror. It does not fold over itself: no warning.</text>
  </g>
</svg>
