<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470"
     font-family="Helvetica, Arial, sans-serif">
  <title>Ray tubes from the source to the surfaces behind and in front of a bored mirror</title>
  <desc>Left: at the source, a hexagonal patch of rays; every three neighboring rays span a triangle,
        a ray tube. A dashed circle marks where the bore of a mirror will cut the beam: the seven
        rays inside it (orange) pass the bore, the rays outside it (blue) are reflected. Top right,
        behind the mirror: only the seven inner rays arrived. The six tubes between them are alive
        and filled; the tubes reaching out to the reflected rays are torn (dashed), their outer
        corners arrived on the other surface (hollow dots). A hatched margin of half a tube height
        runs beyond each edge of the alive tubes. Bottom right, in front of the mirror: the outer
        rays arrived, the tubes between them are alive and form a ring; the tubes reaching into the
        bore are torn, and the ring gets a margin of half a tube height on its inner edge, at the
        cut, as on its outer edge.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <pattern id="margin" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fefcbf"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d69e2e" stroke-width="2"/>
    </pattern>

    <!-- one family of lattice lines, 24 apart, inside a hexagon of three rings -->
    <g id="rows">
      <line x1="-36" y1="-62.35" x2="36" y2="-62.35"/>
      <line x1="-48" y1="-41.57" x2="48" y2="-41.57"/>
      <line x1="-60" y1="-20.78" x2="60" y2="-20.78"/>
      <line x1="-72" y1="0" x2="72" y2="0"/>
      <line x1="-60" y1="20.78" x2="60" y2="20.78"/>
      <line x1="-48" y1="41.57" x2="48" y2="41.57"/>
      <line x1="-36" y1="62.35" x2="36" y2="62.35"/>
    </g>
    <g id="lattice">
      <use href="#rows"/>
      <use href="#rows" transform="rotate(60)"/>
      <use href="#rows" transform="rotate(120)"/>
    </g>
    <polygon id="hex1" points="24,0 12,-20.78 -12,-20.78 -24,0 -12,20.78 12,20.78"/>
    <polygon id="hex2" points="48,0 24,-41.57 -24,-41.57 -48,0 -24,41.57 24,41.57"/>
    <polygon id="hex3" points="72,0 36,-62.35 -36,-62.35 -72,0 -36,62.35 36,62.35"/>
    <clipPath id="inside1"><use href="#hex1"/></clipPath>
    <clipPath id="ring12">
      <path clip-rule="evenodd"
            d="M48,0 L24,-41.57 L-24,-41.57 L-48,0 L-24,41.57 L24,41.57 Z
               M24,0 L12,-20.78 L-12,-20.78 L-24,0 L-12,20.78 L12,20.78 Z"/>
    </clipPath>
    <clipPath id="ring23">
      <path clip-rule="evenodd"
            d="M72,0 L36,-62.35 L-36,-62.35 L-72,0 L-36,62.35 L36,62.35 Z
               M48,0 L24,-41.57 L-24,-41.57 L-48,0 L-24,41.57 L24,41.57 Z"/>
    </clipPath>

    <!-- the rays: the center and the first ring pass the bore -->
    <g id="inner-rays">
      <circle cx="0" cy="0" r="3.5"/>
      <circle cx="24" cy="0" r="3.5"/><circle cx="12" cy="-20.78" r="3.5"/>
      <circle cx="-12" cy="-20.78" r="3.5"/><circle cx="-24" cy="0" r="3.5"/>
      <circle cx="-12" cy="20.78" r="3.5"/><circle cx="12" cy="20.78" r="3.5"/>
    </g>
    <g id="ring2-rays">
      <circle cx="48" cy="0" r="3.5"/><circle cx="36" cy="-20.78" r="3.5"/>
      <circle cx="24" cy="-41.57" r="3.5"/><circle cx="0" cy="-41.57" r="3.5"/>
      <circle cx="-24" cy="-41.57" r="3.5"/><circle cx="-36" cy="-20.78" r="3.5"/>
      <circle cx="-48" cy="0" r="3.5"/><circle cx="-36" cy="20.78" r="3.5"/>
      <circle cx="-24" cy="41.57" r="3.5"/><circle cx="0" cy="41.57" r="3.5"/>
      <circle cx="24" cy="41.57" r="3.5"/><circle cx="36" cy="20.78" r="3.5"/>
    </g>
    <g id="ring3-rays">
      <circle cx="72" cy="0" r="3.5"/><circle cx="60" cy="-20.78" r="3.5"/>
      <circle cx="48" cy="-41.57" r="3.5"/><circle cx="36" cy="-62.35" r="3.5"/>
      <circle cx="12" cy="-62.35" r="3.5"/><circle cx="-12" cy="-62.35" r="3.5"/>
      <circle cx="-36" cy="-62.35" r="3.5"/><circle cx="-48" cy="-41.57" r="3.5"/>
      <circle cx="-60" cy="-20.78" r="3.5"/><circle cx="-72" cy="0" r="3.5"/>
      <circle cx="-60" cy="20.78" r="3.5"/><circle cx="-48" cy="41.57" r="3.5"/>
      <circle cx="-36" cy="62.35" r="3.5"/><circle cx="-12" cy="62.35" r="3.5"/>
      <circle cx="12" cy="62.35" r="3.5"/><circle cx="36" cy="62.35" r="3.5"/>
      <circle cx="48" cy="41.57" r="3.5"/><circle cx="60" cy="20.78" r="3.5"/>
    </g>

    <!-- margins of half a tube height (10.39) beyond the edges of a hexagon of alive tubes -->
    <rect id="m1" x="-12" y="-31.17" width="24" height="10.39"/>
    <g id="margin-out-1">
      <use href="#m1"/><use href="#m1" transform="rotate(60)"/>
      <use href="#m1" transform="rotate(120)"/><use href="#m1" transform="rotate(180)"/>
      <use href="#m1" transform="rotate(240)"/><use href="#m1" transform="rotate(300)"/>
    </g>
    <rect id="m2" x="-24" y="-41.57" width="48" height="10.39"/>
    <g id="margin-in-2">
      <use href="#m2"/><use href="#m2" transform="rotate(60)"/>
      <use href="#m2" transform="rotate(120)"/><use href="#m2" transform="rotate(180)"/>
      <use href="#m2" transform="rotate(240)"/><use href="#m2" transform="rotate(300)"/>
    </g>
    <rect id="m3" x="-36" y="-72.74" width="72" height="10.39"/>
    <g id="margin-out-3">
      <use href="#m3"/><use href="#m3" transform="rotate(60)"/>
      <use href="#m3" transform="rotate(120)"/><use href="#m3" transform="rotate(180)"/>
      <use href="#m3" transform="rotate(240)"/><use href="#m3" transform="rotate(300)"/>
    </g>
  </defs>

  <!-- A background of its own keeps the figure readable on the dark book themes. -->
  <rect x="0" y="0" width="940" height="470" rx="8" fill="#ffffff"/>

  <!-- ── at the source ───────────────────────────────────────────────────── -->
  <text x="160" y="140" font-size="14" font-weight="bold" text-anchor="middle"
        fill="#1a202c">at the source</text>
  <g transform="translate(160,235)">
    <use href="#hex3" fill="#edf2f7"/>
    <use href="#lattice" stroke="#718096" stroke-width="1"/>
    <circle r="34" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 3"/>
    <use href="#inner-rays" fill="#dd6b20"/>
    <use href="#ring2-rays" fill="#2b6cb0"/>
    <use href="#ring3-rays" fill="#2b6cb0"/>
  </g>
  <text x="160" y="332" font-size="11" text-anchor="middle" fill="#4a5568">every three neighboring
    rays</text>
  <text x="160" y="346" font-size="11" text-anchor="middle" fill="#4a5568">span a ray tube</text>

  <!-- ── the two ways the light takes ────────────────────────────────────── -->
  <path d="M 250 200 L 420 128" fill="none" stroke="#4a5568" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="318" y="150" font-size="12" fill="#c05621" text-anchor="middle"
        transform="rotate(-23 318 150)">through the bore</text>
  <path d="M 250 270 L 420 336" fill="none" stroke="#4a5568" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="328" y="322" font-size="12" fill="#2b6cb0" text-anchor="middle"
        transform="rotate(21 328 322)">reflected around the bore</text>

  <!-- ── behind the mirror ───────────────────────────────────────────────── -->
  <text x="520" y="48" font-size="14" font-weight="bold" text-anchor="middle"
        fill="#1a202c">behind the mirror</text>
  <g transform="translate(520,120)">
    <use href="#margin-out-1" fill="url(#margin)"/>
    <use href="#hex1" fill="#feebc8"/>
    <g clip-path="url(#inside1)"><use href="#lattice" stroke="#c05621" stroke-width="1"/></g>
    <use href="#hex1" fill="none" stroke="#c05621" stroke-width="1.5"/>
    <g clip-path="url(#ring12)">
      <use href="#lattice" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3"/>
    </g>
    <use href="#ring2-rays" fill="#ffffff" stroke="#a0aec0" stroke-width="1.2"/>
    <use href="#inner-rays" fill="#dd6b20"/>
  </g>

  <!-- ── in front of the mirror ──────────────────────────────────────────── -->
  <text x="520" y="250" font-size="14" font-weight="bold" text-anchor="middle"
        fill="#1a202c">in front of the mirror</text>
  <g transform="translate(520,350)">
    <use href="#margin-out-3" fill="url(#margin)"/>
    <use href="#margin-in-2" fill="url(#margin)"/>
    <path fill-rule="evenodd" fill="#bee3f8"
          d="M72,0 L36,-62.35 L-36,-62.35 L-72,0 L-36,62.35 L36,62.35 Z
             M48,0 L24,-41.57 L-24,-41.57 L-48,0 L-24,41.57 L24,41.57 Z"/>
    <g clip-path="url(#ring23)"><use href="#lattice" stroke="#2b6cb0" stroke-width="1"/></g>
    <use href="#hex2" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    <use href="#hex3" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    <g clip-path="url(#ring12)">
      <use href="#lattice" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3"/>
    </g>
    <use href="#inner-rays" fill="#ffffff" stroke="#a0aec0" stroke-width="1.2"/>
    <use href="#ring2-rays" fill="#2b6cb0"/>
    <use href="#ring3-rays" fill="#2b6cb0"/>
  </g>

  <!-- ── legend ──────────────────────────────────────────────────────────── -->
  <g font-size="11" fill="#2d3748">
    <rect x="660" y="96" width="22" height="14" fill="#bee3f8" stroke="#2b6cb0"/>
    <text x="692" y="107">alive tube: all three of its rays</text>
    <text x="692" y="121">arrived here, so it is drawn</text>

    <line x1="660" y1="148" x2="682" y2="148" stroke="#a0aec0" stroke-width="1.5"
          stroke-dasharray="3 3"/>
    <text x="692" y="145">torn tube: its rays arrived on</text>
    <text x="692" y="159">different surfaces, neither draws it</text>

    <circle cx="671" cy="186" r="3.5" fill="#ffffff" stroke="#a0aec0" stroke-width="1.2"/>
    <text x="692" y="183">a ray that arrived on</text>
    <text x="692" y="197">the other surface</text>

    <rect x="660" y="216" width="22" height="14" fill="url(#margin)" stroke="#d69e2e"/>
    <text x="692" y="223">margin: half a tube height beyond</text>
    <text x="692" y="237">each edge no alive tube continues,</text>
    <text x="692" y="251">at a cut as at the outer edge</text>

    <circle cx="671" cy="280" r="9" fill="none" stroke="#4a5568" stroke-width="1.5"
            stroke-dasharray="5 3"/>
    <text x="692" y="277">where the bore cuts the beam</text>
    <text x="692" y="291">(seen from the source)</text>
  </g>
  <text x="660" y="350" font-size="12" fill="#1a202c">The map stays dark where</text>
  <text x="660" y="366" font-size="12" fill="#1a202c">no alive tube lies: behind the</text>
  <text x="660" y="382" font-size="12" fill="#1a202c">mirror around the light through</text>
  <text x="660" y="398" font-size="12" fill="#1a202c">the bore, in front of it inside</text>
  <text x="660" y="414" font-size="12" fill="#1a202c">the ring.</text>
</svg>
