<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="Helvetica, Arial, sans-serif">
  <title>The fluence at a corner of the ray tubes</title>
  <desc>Left, at the source: a corner C with its six neighbors and the six tubes they span around
        it. The green hexagon is the Voronoi cell of C, the area A_src it stands for at the source.
        One neighbor (lower right) will arrive on another surface, so the two tubes it belongs to
        tear (red dashed). The four alive tubes around C have the area D_src at the source. Right,
        on the surface: the same four tubes have arrived stretched, with the area D_det; the torn
        tubes count on neither side. Below, the formula: the fluence at C is its energy E over
        A_src, times D_src over D_det.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- A background of its own keeps the figure readable on the dark book themes. -->
  <rect x="0" y="0" width="760" height="440" rx="8" fill="#ffffff"/>

  <!-- ── at the source ───────────────────────────────────────────────────── -->
  <text x="170" y="44" font-size="14" font-weight="bold" text-anchor="middle"
        fill="#1a202c">at the source</text>
  <g transform="translate(170,170)" stroke-linejoin="round">
    <g fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.2">
      <polygon points="0,0 60,0 30,-51.96"/>
      <polygon points="0,0 30,-51.96 -30,-51.96"/>
      <polygon points="0,0 -30,-51.96 -60,0"/>
      <polygon points="0,0 -60,0 -30,51.96"/>
    </g>
    <g fill="none" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="5 3">
      <polygon points="0,0 -30,51.96 30,51.96"/>
      <polygon points="0,0 30,51.96 60,0"/>
    </g>
    <polygon points="30,-17.32 0,-34.64 -30,-17.32 -30,17.32 0,34.64 30,17.32"
             fill="#c6f6d5" fill-opacity="0.6" stroke="#38a169" stroke-width="2"/>
    <g fill="#2d3748">
      <circle cx="60" cy="0" r="4"/><circle cx="30" cy="-51.96" r="4"/>
      <circle cx="-30" cy="-51.96" r="4"/><circle cx="-60" cy="0" r="4"/>
      <circle cx="-30" cy="51.96" r="4"/>
    </g>
    <circle cx="30" cy="51.96" r="4" fill="#ffffff" stroke="#e53e3e" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#1a202c"/>
    <text x="6" y="-6" font-size="13" font-weight="bold" fill="#1a202c">C</text>
  </g>
  <g font-size="11">
    <text x="250" y="110" fill="#2b6cb0">alive tubes around C:</text>
    <text x="250" y="124" fill="#2b6cb0">their area is D_src</text>
    <text x="250" y="158" fill="#38a169">the Voronoi cell of C:</text>
    <text x="250" y="172" fill="#38a169">the area A_src it stands for</text>
    <text x="212" y="236" fill="#c53030">this ray arrives elsewhere:</text>
    <text x="212" y="250" fill="#c53030">its two tubes tear</text>
  </g>

  <path d="M 412 200 L 452 200" fill="none" stroke="#4a5568" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <!-- ── on the surface ──────────────────────────────────────────────────── -->
  <text x="560" y="44" font-size="14" font-weight="bold" text-anchor="middle"
        fill="#1a202c">on the surface</text>
  <g transform="translate(560,170)" stroke-linejoin="round">
    <g fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.2">
      <polygon points="0,0 96,0 48,-62.35"/>
      <polygon points="0,0 48,-62.35 -48,-62.35"/>
      <polygon points="0,0 -48,-62.35 -96,0"/>
      <polygon points="0,0 -96,0 -48,62.35"/>
    </g>
    <g fill="#2d3748">
      <circle cx="96" cy="0" r="4"/><circle cx="48" cy="-62.35" r="4"/>
      <circle cx="-48" cy="-62.35" r="4"/><circle cx="-96" cy="0" r="4"/>
      <circle cx="-48" cy="62.35" r="4"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#1a202c"/>
    <text x="6" y="-6" font-size="13" font-weight="bold" fill="#1a202c">C</text>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="560" y="262" fill="#2b6cb0">the same alive tubes, stretched:</text>
    <text x="560" y="276" fill="#2b6cb0">their area is D_det</text>
    <text x="560" y="294" fill="#c53030">the torn tubes count on neither side</text>
  </g>

  <!-- ── the formula ─────────────────────────────────────────────────────── -->
  <rect x="40" y="318" width="680" height="104" rx="8" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="380" y="350" font-size="18" text-anchor="middle" fill="#1a202c">F = E / A_src · D_src
    / D_det</text>
  <text x="380" y="376" font-size="12" text-anchor="middle" fill="#4a5568">E: the energy the rays
    of C brought to the surface</text>
  <text x="380" y="394" font-size="12" text-anchor="middle" fill="#4a5568">m = D_det / D_src: how
    much the light around C spread out on its way, so F = E / (A_src · m)</text>
  <text x="380" y="412" font-size="12" text-anchor="middle" fill="#4a5568">with helper rays, each
    ray measures its own m and brings its fluence along</text>
</svg>
