[package]
name = "opossum_backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "AE0EF413-A04C-4EF1-BAFA-7F0F01F2A50A"
path-guid = "E3D4E364-1CA1-45A4-A48B-ED66417EA5E0"
license = false
eula = false

[dependencies]
opossum_core = { workspace = true }

log.workspace = true
nalgebra.workspace = true
ron.workspace = true
serde.workspace = true
uom.workspace = true
utoipa.workspace = true
uuid.workspace = true

actix-cors = "0.7"
# actix-web = "4.11"
# Disable default features to avoid compiling brotli, zstd-sys, and flate2.
# We explicitly re-enable 'macros' for routing attributes like #[get("/")].
actix-web = { version = "4", default-features = false, features = ["macros"] }
futures-util = "0.3"
parking_lot = "0.12"
tokio-stream = "0.1"
utoipa-actix-web = "0.1"
utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
tokio = { version = "1", features = ["process"] }
# reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Add ureq with minimal features for TLS and Serde JSON support:
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
semver = "1.0"